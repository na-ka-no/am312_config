description: |
  PIR Switch 本体の動作。&pir <コマンド> で使う（コマンドは dt-bindings/zmk/pir_switch.h）。
  モードごとに送るキーの手順は、フラッシュの設定領域から読み込む。
  設定領域は設定サイト（docs/index.html）で作った .uf2 で書き込む。
  設定領域が空・壊れている場合は modeN-default-keys の手順を使う。

compatible: "zmk,behavior-pir-switch"

include: one_param.yaml

properties:
  key-press:
    type: phandle
    required: true
    description: キー送信に使う &kp
  config-partition:
    type: phandle
    required: true
    description: 設定データを置くフラッシュのパーティション
  mode-leds:
    type: phandles
    required: true
    description: モード1・モード2の LED（gpio-leds の子ノード）
  red-led:
    type: phandle
    required: true
    description: 起動時の電池残量表示に使う赤の LED（gpio-leds の子ノード）
  mode1-default-keys:
    type: array
    required: true
    description: 設定がないときにモード1で送るキー（&kp に渡す値）
  mode2-default-keys:
    type: array
    required: true
    description: 設定がないときにモード2で送るキー（&kp に渡す値）
  tap-ms:
    type: int
    default: 30
  wait-ms:
    type: int
    default: 30
  indicator-hold-ms:
    type: int
    default: 2000
    description: センサー出力が LOW に戻ってから LED を消すまでの時間（ミリ秒）

description: |
  センサーが反応したときに送るキーの手順を、フラッシュの設定領域から読み込むマクロ。
  設定領域は設定サイト（docs/index.html）で作った .uf2 で書き込む。
  設定領域が空・壊れている場合は default-keys の手順を使う。

compatible: "zmk,behavior-pir-config-macro"

include: zero_param.yaml

properties:
  key-press:
    type: phandle
    required: true
    description: キー送信に使う &kp
  config-partition:
    type: phandle
    required: true
    description: 設定データを置くフラッシュのパーティション
  default-keys:
    type: array
    required: true
    description: 設定がないときに送るキー（&kp に渡す値）
  tap-ms:
    type: int
    default: 30
  wait-ms:
    type: int
    default: 30
  status-led:
    type: phandle
    description: 反応してから次に反応できるようになるまで点ける LED（gpio-leds の子ノード）
  status-led-hold-ms:
    type: int
    default: 2000
    description: センサー出力が LOW に戻ってから LED を消すまでの時間（ミリ秒）
